<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palabras Mágicas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="title-area">
        <h1>🌈 Palabras Mágicas</h1>
        <p class="subtitle">¡Aprendamos jugando!</p>
      </header>

      <section class="card">
        <p class="instruction" id="instruction">Toca la palabra correcta</p>
        <h2 class="target-word" id="targetWord">mamá</h2>

        <div class="options" id="options"></div>

        <p class="message" id="message" aria-live="polite"></p>
        <button class="next-button" id="nextButton" type="button">Siguiente palabra</button>
      </section>

      <section class="stars" aria-hidden="true">
        <span>⭐</span><span>✨</span><span>⭐</span><span>✨</span><span>⭐</span>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
